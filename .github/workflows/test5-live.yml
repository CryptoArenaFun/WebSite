name: Test5 published smoke audit
on:
  push:
    branches: [main]
    paths: ['test5/**', '.github/workflows/test5-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      QA_BASE_URL: https://cryptoarena.fun
      QA_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps "$BROWSER"
      - name: Verify published Test5 route
        run: |
          for i in $(seq 1 24); do
            if curl --max-time 15 -fsSL https://cryptoarena.fun/test5/ | grep -q 'CryptoArena — Responsive Preview'; then exit 0; fi
            sleep 10
          done
          echo 'Test5 deployment not verified' >&2
          exit 1
      - run: node qa/responsive-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test5-live-${{ matrix.browser }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14
