name: Responsive browser audit
on:
  pull_request:
    paths: ['test5/**', 'qa/**', 'vite.config.ts', 'tsconfig.app.json', '.github/workflows/responsive-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps "$BROWSER"
      - name: Build
        run: npm run build
      - name: Start local preview and audit
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          node qa/responsive-audit.mjs
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-${{ matrix.browser }}
          path: |
            qa-results/
            preview.log
          if-no-files-found: warn
          retention-days: 14
